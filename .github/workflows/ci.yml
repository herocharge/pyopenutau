name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Python ${{ matrix.python }} / ${{ matrix.os }} (no native engine)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.11'}
          - {os: windows-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: python -m mypy
      - run: python examples/synthetic.py output/authoring --author-only
      - run: python examples/compose.py output/composition.ustx

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m build --no-isolation
      - run: python scripts/check_dist.py dist
      - name: Install wheel outside editable source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from pyopenutau import Project, Vocal; Project().save('wheel-check.ustx')"
